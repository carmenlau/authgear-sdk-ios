name: CI

on:
  push:
    branches:
      - "*"
      - "!gh-pages"
  pull_request:
    branches:
      - "*"
      - "!gh-pages"

jobs:
  gh-pages:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          # runs 'bundle install' and caches installed gems automatically
          bundler-cache: true
      - run: make ruby-audit
      # swiftformat is pre-installed on the runner.
      # Output its version.
      - run: swiftformat --version
      - run: make format
      - run: sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer
      - run: make pod-install
      - run: make xcframework
      - run: make test
      - run: make docs
      - name: Deploy docs to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        if: ${{ github.repository == 'authgear/authgear-sdk-ios' && github.ref == 'refs/heads/main' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
  ios:
    if: ${{ github.repository == 'authgear/authgear-sdk-ios' && github.event_name == 'push' }}
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4
    - uses: ruby/setup-ruby@v1
      with:
        # runs 'bundle install' and caches installed gems automatically
        bundler-cache: true
    - run: make ruby-audit
    - run: sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer
    - run: make pod-install
    - uses: authgear/gh-actions-install-apple-certificate-and-provisioning-profile@v1
      with:
        certificate_base64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
        certificate_password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        provisioning_profile_base64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
    - uses: authgear/gh-actions-create-fastlane-api-key-json-file@v1
      with:
        api_key_id: ${{ secrets.IOS_API_KEY_ID }}
        api_key_issuer: ${{ secrets.IOS_API_KEY_ISSUER }}
        api_key_base64: ${{ secrets.IOS_API_KEY_BASE64 }}
        output_path: ./build/fastlane-api-key.json
    - run: make build-app
    # TODO(demo-app2app): temporary diagnostic, remove once the app1 upload
    # failure is understood.
    #
    # app1 uploads fail with "the bundle identifier cannot be changed from the
    # current value, 'com.authgear.sdk.exampleapp.ios.app2'" even though the
    # ipa carries app1's own bundle id. This step gathers two facts:
    #
    # 1. The ipa's real CFBundleIdentifier, which so far has only been
    #    inferred from which app pilot resolved.
    # 2. Whether altool reproduces the 409 with no fastlane in the loop.
    #    FastlaneCore::AltoolTransporterExecutor issues
    #    `altool --upload-app -f <ipa>`, so --validate-app -f <ipa> exercises
    #    the same server-side app-inference path, and may report a more
    #    detailed error payload than fastlane surfaces.
    #
    # --validate-app runs the same validation as --upload-app but uploads
    # nothing, so this is safe to run on any branch.
    - name: Inspect ipa and validate with altool directly (diagnostic)
      continue-on-error: true
      env:
        API_KEY_ID: ${{ secrets.IOS_API_KEY_ID }}
        API_KEY_ISSUER: ${{ secrets.IOS_API_KEY_ISSUER }}
        API_KEY_BASE64: ${{ secrets.IOS_API_KEY_BASE64 }}
      run: |
        IPA=./build/Release/iOS/ios_example/ios_example.ipa
        # Non-fatal: the job runs under `bash -eo pipefail`, and this is only
        # informational - it must not stop the altool check below from running.
        echo "--- ipa CFBundleIdentifier ---"
        unzip -p "$IPA" 'Payload/*.app/Info.plist' \
          | plutil -extract CFBundleIdentifier raw - \
          || echo "(could not read bundle id from ipa)"
        echo "--- altool --validate-app ---"
        # The decoded key must never reach the log. GitHub masks the base64
        # form (it is a secret value) but NOT the decoded form, so:
        #  - pipe straight into the file, never to stdout
        #  - 2>/dev/null so a decode error cannot echo anything
        #  - check the result with test -s, which reports success/failure
        #    without printing the contents
        KEYFILE=~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8
        mkdir -p ~/.appstoreconnect/private_keys
        echo -n "$API_KEY_BASE64" | base64 --decode > "$KEYFILE" 2>/dev/null
        chmod 600 "$KEYFILE"
        test -s "$KEYFILE" || { echo "failed to decode API key"; exit 1; }
        xcrun altool --validate-app \
          -f "$IPA" \
          -t ios \
          --apiKey "$API_KEY_ID" \
          --apiIssuer "$API_KEY_ISSUER"
    - name: Upload to TestFlight
      if: ${{ github.ref == 'refs/heads/main' }}
      run: make upload-app
  ios-app2:
    if: ${{ github.repository == 'authgear/authgear-sdk-ios' && github.event_name == 'push' }}
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4
    - uses: ruby/setup-ruby@v1
      with:
        # runs 'bundle install' and caches installed gems automatically
        bundler-cache: true
    - run: sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer
    - run: make pod-install
    - uses: authgear/gh-actions-install-apple-certificate-and-provisioning-profile@v1
      with:
        certificate_base64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
        certificate_password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        provisioning_profile_base64: ${{ secrets.IOS_APP2_PROVISIONING_PROFILE_BASE64 }}
    - uses: authgear/gh-actions-create-fastlane-api-key-json-file@v1
      with:
        api_key_id: ${{ secrets.IOS_API_KEY_ID }}
        api_key_issuer: ${{ secrets.IOS_API_KEY_ISSUER }}
        api_key_base64: ${{ secrets.IOS_API_KEY_BASE64 }}
        output_path: ./build/fastlane-api-key.json
    - run: make build-app2
    - name: Upload to TestFlight
      if: ${{ github.ref == 'refs/heads/main' }}
      run: make upload-app2
